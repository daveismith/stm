version: "3"
services: 
  shoot-backend:
    container_name: "shoot-backend"
    build:
      context: "./backend/ShootTheMoon"
      dockerfile: "ShootTheMoon/Dockerfile"
    ports: 
      - "8000:80"
      - "30052:30052"
    environment:
      Serilog__MinimumLevel: "Debug"
  shoot-proxy:
    container_name: "shoot-proxy"
    depends_on: 
      - shoot-backend
    build:
      context: "./proxy"
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
  shoot-frontend:
    container_name: "shoot-frontend"
    build:
        context: "./frontend/shoot-client"
        dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8001:80"
  shoot-botserver:
    container_name: "shoot-botserver"
    build:
      context: "./backend/ShootTheMoon"
      dockerfile: "Bot/Dockerfile"
    ports:
      - "30053:30053"